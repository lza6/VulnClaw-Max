[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnclaw-plugin-demo"
version = "0.1.0"
description = "Example VulnClaw detection plugin: flags Set-Cookie values missing security attributes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.entry-points."vulnclaw.plugins"]
cookie-flags = "vulnclaw_plugin_demo:CookieFlagsPlugin"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
